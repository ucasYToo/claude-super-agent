<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6fa" />
    <title>Super Agent · 工作台</title>
    <link rel="stylesheet" href="./console.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="mast">
      <div class="topline wrap">
        <a class="brand" href="#workbench"
          ><span class="mark" aria-hidden="true"></span>Super Agent</a
        >
        <div class="top-context">
          <span id="connection" class="connection" role="status">连接中</span>
          <label>工作区<select id="workspace"></select></label>
          <label>会话<select id="route"></select></label>
        </div>
      </div>
      <div class="navband"><nav class="wrap" aria-label="功能"></nav></div>
    </header>
    <main class="wrap">
      <div class="pagehead">
        <h1 id="heading">运行概览</h1>
        <span id="page-detail"></span>
      </div>
      <p id="feedback" role="status" hidden></p>
      <div id="content"></div>
    </main>
  </body>
</html>
